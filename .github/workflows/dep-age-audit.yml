name: Dependency Age Audit

# Enforces a minimum publish-age floor on every Python and npm dependency
# declared by the project. Blocks PRs (and direct pushes to tracked
# branches) that would introduce a package version younger than
# MIN_AGE_DAYS (default 21).
#
# Companion to .github/workflows/supply-chain-audit.yml (which scans for
# executable-payload patterns in diffs) and uv-lockfile-check.yml (which
# verifies uv.lock matches pyproject.toml). Those check WHAT is being
# added; this one checks WHEN it was published.
#
# What this does NOT block:
#   - Existing committed deps that pre-date the policy
#   - Malicious code execution at runtime (rely on code review + the
#     community-detection time the publish-age floor buys you)
#   - Install-time payloads on developer machines (those are blocked by
#     ui-tui/.npmrc ignore-scripts=true, which fires before this check)
#
# CI-side counterpart to the pre-commit hook in scripts/git-hooks/.

on:
  push:
    paths:
      - 'pyproject.toml'
      - 'ui-tui/package-lock.json'
      - 'scripts/npm-audit-min-age.js'
      - '.github/workflows/dep-age-audit.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'pyproject.toml'
      - 'ui-tui/package-lock.json'
      - 'scripts/npm-audit-min-age.js'
      - '.github/workflows/dep-age-audit.yml'

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: dep-age-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MIN_AGE_DAYS: 21

jobs:
  python-age:
    name: Python deps publish-age floor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Resolve under publish-age cutoff
        id: resolve
        run: |
          set -euo pipefail
          CUTOFF=$(date -d "${MIN_AGE_DAYS} days ago" +%Y-%m-%d)
          echo "MIN_AGE_DAYS=${MIN_AGE_DAYS}  CUTOFF=${CUTOFF}"
          mkdir -p /tmp/audit
          if uv pip compile pyproject.toml \
               --exclude-newer "$CUTOFF" \
               --generate-hashes \
               --output-file /tmp/audit/locked.txt \
               > /tmp/audit/py-out.txt 2>&1; then
            echo "Python audit PASSED — all deps older than ${MIN_AGE_DAYS} days under cutoff ${CUTOFF}"
            wc -l /tmp/audit/locked.txt
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Python deps cannot resolve under ${MIN_AGE_DAYS}d floor"
            tail -100 /tmp/audit/py-out.txt
            {
              echo "CUTOFF=${CUTOFF}"
              echo "---"
              tail -50 /tmp/audit/py-out.txt
            } > /tmp/audit/py-comment.txt
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment on Python policy violation
        if: steps.resolve.outputs.found == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="## ⚠️ Dependency Age Audit — Python

          One or more dependencies declared in \`pyproject.toml\` cannot be resolved with all versions at least **${MIN_AGE_DAYS} days old** (cutoff ${CUTOFF}).

          Common causes:
          1. A direct dependency is pinned to a too-recent version
          2. A transitive dependency has no pre-cutoff version satisfying upstream constraints
          3. A package was recently quarantined (yanked) on PyPI

          **uv resolver output (last 50 lines):**
          \`\`\`
          $(cat /tmp/audit/py-comment.txt)
          \`\`\`

          To remediate, see \`SUPPLY_CHAIN_EXCEPTIONS.md\` for the per-package exception process. **Do not lower \`MIN_AGE_DAYS\` globally** — the threat model is per-package."
          gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY" \
            || echo "::warning::Could not post PR comment (expected for fork PRs — GITHUB_TOKEN is read-only)"

      - name: Fail on Python policy violation
        if: steps.resolve.outputs.found == 'true'
        run: exit 1

  npm-age:
    name: npm deps publish-age floor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Verify auditor script present
        run: |
          test -f scripts/npm-audit-min-age.js \
            || { echo "::error::scripts/npm-audit-min-age.js missing"; exit 1; }

      - name: Run npm-audit-min-age.js against ui-tui/package-lock.json
        id: audit
        run: |
          set -euo pipefail
          if [ ! -f ui-tui/package-lock.json ]; then
            echo "::warning::no ui-tui/package-lock.json to audit; skipping"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/audit
          if MIN_AGE_DAYS="${MIN_AGE_DAYS}" node scripts/npm-audit-min-age.js \
               ui-tui/package-lock.json \
               > /tmp/audit/npm.out 2>&1; then
            cat /tmp/audit/npm.out
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::npm deps violate ${MIN_AGE_DAYS}d floor"
            tail -120 /tmp/audit/npm.out
            tail -80 /tmp/audit/npm.out > /tmp/audit/npm-comment.txt
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment on npm policy violation
        if: steps.audit.outputs.found == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="## ⚠️ Dependency Age Audit — npm

          One or more entries in \`ui-tui/package-lock.json\` were published less than **${MIN_AGE_DAYS} days ago**, or have an unknown publish time (typically: quarantined/yanked packages).

          **Audit output (last 80 lines):**
          \`\`\`
          $(cat /tmp/audit/npm-comment.txt)
          \`\`\`

          To remediate:
          1. Pin offending direct dependencies in \`ui-tui/package.json\` to a pre-cutoff version
          2. For transitive deps, add an \`overrides\` block in \`ui-tui/package.json\`
          3. Regenerate the lockfile with \`npm install --package-lock-only\` (never plain \`npm install\` — that re-resolves)
          4. Document a per-package exception in \`SUPPLY_CHAIN_EXCEPTIONS.md\` if waiting is not viable"
          gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY" \
            || echo "::warning::Could not post PR comment (expected for fork PRs)"

      - name: Fail on npm policy violation
        if: steps.audit.outputs.found == 'true'
        run: exit 1
